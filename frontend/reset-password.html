<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - CodeAlpha Portfolio Builder</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .reset-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>

  <div class="reset-card">
    <h2 style="color: #fff; text-align: center; font-weight: 600; margin-top: 0;">Set New Password</h2>
    <p style="color: rgba(255,255,255,0.7); text-align: center; font-size: 0.85rem; margin-bottom: 24px;">Please enter your new password below.</p>
    
    <form id="reset-form" novalidate>
      <div class="form-group">
        <label for="new-password">New Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="new-password"
            name="password"
            placeholder="At least 6 characters"
            required
            minlength="6"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Retype new password"
            required
          />
        </div>
      </div>

      <div id="reset-message" class="form-message" role="alert" aria-live="polite"></div>

      <button type="submit" id="reset-btn" class="btn btn-primary btn-full">
        <span class="btn-text">Reset Password</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>
    </form>
  </div>

  <script src="js/api.js?v=5"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
